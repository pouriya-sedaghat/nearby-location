name: nearby-development

services:
  nearby:
    build:
      context: ..
      dockerfile: Dockerfile
      target: ${NODE_ENV:-production}
    container_name: nearby
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-8080}
      - BASE_URL=${BASE_URL:-/}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-}
      - SWAGGER_TRY_IT_OUT_ENABLED=${SWAGGER_TRY_IT_OUT_ENABLED:-}
      - SWAGGER_AUTH_USERNAME=${SWAGGER_AUTH_USERNAME:-}
      - SWAGGER_AUTH_PASSWORD=${SWAGGER_AUTH_PASSWORD:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SHUTDOWN_TIMEOUT_MS=${SHUTDOWN_TIMEOUT_MS:-10000}
      - SHUTDOWN_DRAIN_DELAY_MS=${SHUTDOWN_DRAIN_DELAY_MS:-2000}
      - RUN_MIGRATIONS_ON_STARTUP=${RUN_MIGRATIONS_ON_STARTUP:-true}
      - DATABASE_URL=postgresql://postgres:example@postgres:5432/nearby
      - LOCATION_TTL_DAYS=${LOCATION_TTL_DAYS:-7}
      - "CLEANUP_CRON_SCHEDULE=${CLEANUP_CRON_SCHEDULE:-0 3 * * *}"
      - CLEANUP_BATCH_SIZE=${CLEANUP_BATCH_SIZE:-5000}
      - CLEANUP_MAX_BATCHES_PER_RUN=${CLEANUP_MAX_BATCHES_PER_RUN:-100}
      - CLEANUP_BATCH_DELAY_MS=${CLEANUP_BATCH_DELAY_MS:-25}
      - CLEANUP_STATEMENT_TIMEOUT_MS=${CLEANUP_STATEMENT_TIMEOUT_MS:-15000}
      - CLEANUP_LOCK_TIMEOUT_MS=${CLEANUP_LOCK_TIMEOUT_MS:-1000}
      - DEFAULT_MAX_DISTANCE_METERS=${DEFAULT_MAX_DISTANCE_METERS:-10000}
      - MAX_MAX_DISTANCE_METERS=${MAX_MAX_DISTANCE_METERS:-100000}
      - RANKING_MODE=${RANKING_MODE:-legacy}
      - RANKING_DISTANCE_SCALE_METERS=${RANKING_DISTANCE_SCALE_METERS:-2000}
      - RANKING_FRESHNESS_HALF_LIFE_MINUTES=${RANKING_FRESHNESS_HALF_LIFE_MINUTES:-60}
      - RANKING_DISTANCE_WEIGHT=${RANKING_DISTANCE_WEIGHT:-0.65}
      - RANKING_FRESHNESS_WEIGHT=${RANKING_FRESHNESS_WEIGHT:-0.35}
      - CURSOR_MAX_AGE_MINUTES=${CURSOR_MAX_AGE_MINUTES:-60}
      - CURSOR_SIGNING_SECRET=${CURSOR_SIGNING_SECRET:-}
      - CURSOR_SIGNING_PREVIOUS_SECRET=${CURSOR_SIGNING_PREVIOUS_SECRET:-}
      - CURSOR_REQUIRE_SIGNATURE=${CURSOR_REQUIRE_SIGNATURE:-false}
      - PG_POOL_MAX=${PG_POOL_MAX:-10}
      - PG_APPLICATION_NAME=${PG_APPLICATION_NAME:-nearby-location}
      - PG_KEEP_ALIVE_INITIAL_DELAY_MS=${PG_KEEP_ALIVE_INITIAL_DELAY_MS:-10000}
      - PG_IDLE_TIMEOUT_MS=${PG_IDLE_TIMEOUT_MS:-30000}
      - PG_CONN_TIMEOUT_MS=${PG_CONN_TIMEOUT_MS:-5000}
      - PG_STATEMENT_TIMEOUT_MS=${PG_STATEMENT_TIMEOUT_MS:-2000}
      - PG_CONNECT_RETRIES=${PG_CONNECT_RETRIES:-10}
      - PG_CONNECT_BASE_DELAY_MS=${PG_CONNECT_BASE_DELAY_MS:-1000}
      - PG_SSL=${PG_SSL:-false}
      - PG_SSL_REJECT_UNAUTHORIZED=${PG_SSL_REJECT_UNAUTHORIZED:-true}
      - LOCATION_AUTH_MODE=${LOCATION_AUTH_MODE:-disabled}
      - LOCATION_AUTH_TOKEN=${LOCATION_AUTH_TOKEN:-}
      - LOCATION_AUTH_PREVIOUS_TOKEN=${LOCATION_AUTH_PREVIOUS_TOKEN:-}
      - METRICS_AUTH_MODE=${METRICS_AUTH_MODE:-disabled}
      - METRICS_AUTH_TOKEN=${METRICS_AUTH_TOKEN:-}
      - METRICS_AUTH_PREVIOUS_TOKEN=${METRICS_AUTH_PREVIOUS_TOKEN:-}
      - PRIVACY_API_ENABLED=${PRIVACY_API_ENABLED:-false}
      - PRIVACY_AUTH_TOKEN=${PRIVACY_AUTH_TOKEN:-}
      - PRIVACY_AUTH_PREVIOUS_TOKEN=${PRIVACY_AUTH_PREVIOUS_TOKEN:-}
      - HTTP_TRUST_PROXY=${HTTP_TRUST_PROXY:-false}
      - ADMISSION_ENABLED=${ADMISSION_ENABLED:-true}
      - NEARBY_MAX_IN_FLIGHT=${NEARBY_MAX_IN_FLIGHT:-50}
      - UPSERT_MAX_IN_FLIGHT=${UPSERT_MAX_IN_FLIGHT:-100}
      - ADAPTIVE_ADMISSION_ENABLED=${ADAPTIVE_ADMISSION_ENABLED:-false}
      - ADAPTIVE_NEARBY_MIN_IN_FLIGHT=${ADAPTIVE_NEARBY_MIN_IN_FLIGHT:-5}
      - ADAPTIVE_UPSERT_MIN_IN_FLIGHT=${ADAPTIVE_UPSERT_MIN_IN_FLIGHT:-10}
      - ADAPTIVE_NEARBY_LATENCY_TARGET_MS=${ADAPTIVE_NEARBY_LATENCY_TARGET_MS:-250}
      - ADAPTIVE_UPSERT_LATENCY_TARGET_MS=${ADAPTIVE_UPSERT_LATENCY_TARGET_MS:-100}
      - ADAPTIVE_INITIAL_LIMIT_PERCENT=${ADAPTIVE_INITIAL_LIMIT_PERCENT:-50}
      - ADAPTIVE_EWMA_ALPHA=${ADAPTIVE_EWMA_ALPHA:-0.2}
      - ADAPTIVE_INCREASE_EVERY=${ADAPTIVE_INCREASE_EVERY:-20}
      - ADAPTIVE_DECREASE_FACTOR=${ADAPTIVE_DECREASE_FACTOR:-0.8}
      - ADAPTIVE_DECREASE_COOLDOWN_MS=${ADAPTIVE_DECREASE_COOLDOWN_MS:-1000}
      - PG_POOL_WAITING_REJECT_THRESHOLD=${PG_POOL_WAITING_REJECT_THRESHOLD:-10}
      - DB_CIRCUIT_FAILURE_THRESHOLD=${DB_CIRCUIT_FAILURE_THRESHOLD:-5}
      - DB_CIRCUIT_OPEN_MS=${DB_CIRCUIT_OPEN_MS:-5000}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-false}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_NEARBY_MAX=${RATE_LIMIT_NEARBY_MAX:-120}
      - RATE_LIMIT_UPSERT_MAX=${RATE_LIMIT_UPSERT_MAX:-240}
      - RATE_LIMIT_MAX_KEYS=${RATE_LIMIT_MAX_KEYS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nearby-net
    stop_grace_period: ${STOP_GRACE_PERIOD:-15s}
    restart: ${RESTART_POLICY:-unless-stopped}

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: nearby-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: nearby
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nearby"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nearby-net

networks:
  nearby-net:
    name: nearby-net

volumes:
  postgres-data:
    name: postgres-data
