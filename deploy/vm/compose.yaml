name: nearby-evaluation

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nearby:
    image: ${VM_IMAGE:-nearby-location:vm}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: production
    ports:
      - "127.0.0.1:${VM_HTTP_PORT:-8081}:8080"
    environment:
      NODE_ENV: production
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SWAGGER_TRY_IT_OUT_ENABLED: ${SWAGGER_TRY_IT_OUT_ENABLED:-false}
      SWAGGER_AUTH_USERNAME: ${SWAGGER_AUTH_USERNAME:-}
      SWAGGER_AUTH_PASSWORD: ${SWAGGER_AUTH_PASSWORD:-}
      PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Run vm.sh init first}@postgres:5432/nearby_vm
      RUN_MIGRATIONS_ON_STARTUP: "true"
      SHUTDOWN_TIMEOUT_MS: "10000"
      SHUTDOWN_DRAIN_DELAY_MS: "2000"
      LOCATION_AUTH_MODE: bearer
      LOCATION_AUTH_TOKEN: ${LOCATION_AUTH_TOKEN:?Run vm.sh init first}
      METRICS_AUTH_MODE: bearer
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?Run vm.sh init first}
      PRIVACY_API_ENABLED: "true"
      PRIVACY_AUTH_TOKEN: ${PRIVACY_AUTH_TOKEN:?Run vm.sh init first}
      CURSOR_SIGNING_SECRET: ${CURSOR_SIGNING_SECRET:?Run vm.sh init first}
      CURSOR_REQUIRE_SIGNATURE: "true"
      PG_SSL: "false"
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-2000}
      LOCATION_TTL_DAYS: "7"
      RANKING_MODE: legacy
      HTTP_TRUST_PROXY: "false"
      ADMISSION_ENABLED: "true"
      ADAPTIVE_ADMISSION_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nearby_vm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run vm.sh init first}
      # SQL parameter details are unnecessary for this synthetic test report.
    command: ["postgres", "-c", "log_statement=none", "-c", "log_parameter_max_length_on_error=0"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nearby_vm"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging

volumes:
  postgres-data:
