# Opt-in autoscaling example. Do not add this file to kustomization.yaml until
# `npm run capacity:check` passes with CAPACITY_EXPECTED_REPLICAS equal to
# maxReplicas + rollout surge + canary replicas, with separate terminating-pod
# connection headroom. Adaptive admission protects each pod, but it cannot create more
# PostgreSQL connection capacity.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nearby-location
  labels:
    app.kubernetes.io/name: nearby-location
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nearby-location
  minReplicas: 3
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
