# Opt-in canary Deployment. It deliberately uses a different app name so the
# stable Service does not accidentally select canary pods. Keep migrations in
# the dedicated migration Job; canary pods must never migrate on startup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nearby-location-canary
  labels:
    app.kubernetes.io/name: nearby-location-canary
    app.kubernetes.io/part-of: nearby-location
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "2.14.0"
    app.kubernetes.io/track: canary
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nearby-location-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nearby-location-canary
        app.kubernetes.io/part-of: nearby-location
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "2.14.0"
        app.kubernetes.io/track: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nearby-location
          image: nearby-location:2.14.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nearby-location-config
          env:
            - name: SWAGGER_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nearby-location-secrets
                  key: SWAGGER_AUTH_USERNAME
                  optional: true
            - name: SWAGGER_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nearby-location-secrets
                  key: SWAGGER_AUTH_PASSWORD
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nearby-location-secrets
                  key: DATABASE_URL
            - name: CURSOR_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: nearby-location-secrets
                  key: CURSOR_SIGNING_SECRET
            - name: CURSOR_SIGNING_PREVIOUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: nearby-location-secrets
                  key: CURSOR_SIGNING_PREVIOUS_SECRET
                  optional: true
            - name: LOCATION_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nearby-location-secrets
                  key: LOCATION_AUTH_TOKEN
                  optional: true
            - name: LOCATION_AUTH_PREVIOUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nearby-location-secrets
                  key: LOCATION_AUTH_PREVIOUS_TOKEN
                  optional: true
            - name: METRICS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nearby-location-secrets
                  key: METRICS_AUTH_TOKEN
                  optional: true
            - name: METRICS_AUTH_PREVIOUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nearby-location-secrets
                  key: METRICS_AUTH_PREVIOUS_TOKEN
                  optional: true
            - name: PRIVACY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nearby-location-secrets
                  key: PRIVACY_AUTH_TOKEN
                  optional: true
            - name: PRIVACY_AUTH_PREVIOUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nearby-location-secrets
                  key: PRIVACY_AUTH_PREVIOUS_TOKEN
                  optional: true
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
