apiVersion: v1
kind: ConfigMap
metadata:
  name: nearby-location-config
  labels:
    app.kubernetes.io/name: nearby-location
data:
  NODE_ENV: "production"
  BASE_URL: "/"
  SWAGGER_ENABLED: "false"
  SWAGGER_TRY_IT_OUT_ENABLED: "false"
  PORT: "8080"
  LOG_LEVEL: "info"
  RUN_MIGRATIONS_ON_STARTUP: "false"
  SHUTDOWN_TIMEOUT_MS: "25000"
  SHUTDOWN_DRAIN_DELAY_MS: "2000"
  LOCATION_TTL_DAYS: "7"
  CLEANUP_CRON_SCHEDULE: "0 3 * * *"
  CLEANUP_BATCH_SIZE: "5000"
  CLEANUP_MAX_BATCHES_PER_RUN: "100"
  CLEANUP_BATCH_DELAY_MS: "25"
  CLEANUP_STATEMENT_TIMEOUT_MS: "15000"
  CLEANUP_LOCK_TIMEOUT_MS: "1000"
  DEFAULT_MAX_DISTANCE_METERS: "10000"
  MAX_MAX_DISTANCE_METERS: "100000"
  RANKING_MODE: "legacy"
  CURSOR_MAX_AGE_MINUTES: "60"
  CURSOR_REQUIRE_SIGNATURE: "true"
  PG_POOL_MAX: "10"
  PG_APPLICATION_NAME: "nearby-location"
  PG_KEEP_ALIVE_INITIAL_DELAY_MS: "10000"
  PG_IDLE_TIMEOUT_MS: "30000"
  PG_CONN_TIMEOUT_MS: "5000"
  PG_STATEMENT_TIMEOUT_MS: "2000"
  PG_CONNECT_RETRIES: "10"
  PG_CONNECT_BASE_DELAY_MS: "1000"
  PG_SSL: "true"
  PG_SSL_REJECT_UNAUTHORIZED: "true"
  # Start disabled for backward-compatible rollout. After the secret keys are
  # provisioned to every caller/pod, switch LOCATION_AUTH_MODE to "bearer".
  LOCATION_AUTH_MODE: "disabled"
  METRICS_AUTH_MODE: "disabled"
  # Privacy erasure is a separate, opt-in control-plane surface.
  PRIVACY_API_ENABLED: "false"
  HTTP_TRUST_PROXY: "false"
  ADMISSION_ENABLED: "true"
  NEARBY_MAX_IN_FLIGHT: "50"
  UPSERT_MAX_IN_FLIGHT: "100"
  ADAPTIVE_ADMISSION_ENABLED: "true"
  ADAPTIVE_NEARBY_MIN_IN_FLIGHT: "5"
  ADAPTIVE_UPSERT_MIN_IN_FLIGHT: "10"
  ADAPTIVE_NEARBY_LATENCY_TARGET_MS: "250"
  ADAPTIVE_UPSERT_LATENCY_TARGET_MS: "100"
  ADAPTIVE_INITIAL_LIMIT_PERCENT: "50"
  ADAPTIVE_EWMA_ALPHA: "0.2"
  ADAPTIVE_INCREASE_EVERY: "20"
  ADAPTIVE_DECREASE_FACTOR: "0.8"
  ADAPTIVE_DECREASE_COOLDOWN_MS: "1000"
  PG_POOL_WAITING_REJECT_THRESHOLD: "10"
  DB_CIRCUIT_FAILURE_THRESHOLD: "5"
  DB_CIRCUIT_OPEN_MS: "5000"
  RATE_LIMIT_ENABLED: "false"
