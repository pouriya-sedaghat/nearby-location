# Example only. Do not commit real secrets and do not apply this file unchanged.
apiVersion: v1
kind: Secret
metadata:
  name: nearby-location-secrets
  labels:
    app.kubernetes.io/name: nearby-location
type: Opaque
stringData:
  # No URL TLS parameters: the ConfigMap's PG_SSL=true and
  # PG_SSL_REJECT_UNAUTHORIZED=true own verified TLS. Adding sslmode/ssl/
  # sslrootcert here is rejected at startup because pg would let the URL
  # silently override those settings.
  DATABASE_URL: "postgresql://nearby:replace-me@postgres.example.internal:5432/nearby"
  CURSOR_SIGNING_SECRET: "replace-with-at-least-32-random-characters-before-deploy"
  # Required only when SWAGGER_ENABLED=true outside development:
  # SWAGGER_AUTH_USERNAME: "docs"
  # SWAGGER_AUTH_PASSWORD: "replace-with-an-independent-32-plus-character-password"
  LOCATION_AUTH_TOKEN: "replace-with-at-least-32-random-characters-before-enabling-bearer-auth"
  # Optional during zero-downtime service-auth rotation:
  # LOCATION_AUTH_PREVIOUS_TOKEN: "previous-location-auth-token"
  # Optional only when METRICS_AUTH_MODE=bearer:
  # METRICS_AUTH_TOKEN: "replace-with-at-least-32-random-characters"
  # METRICS_AUTH_PREVIOUS_TOKEN: "previous-metrics-auth-token"
  # Required only when PRIVACY_API_ENABLED=true:
  # PRIVACY_AUTH_TOKEN: "replace-with-at-least-32-random-characters"
  # PRIVACY_AUTH_PREVIOUS_TOKEN: "previous-privacy-auth-token"
  # Optional during zero-downtime cursor-key rotation:
  # CURSOR_SIGNING_PREVIOUS_SECRET: "previous-secret"
