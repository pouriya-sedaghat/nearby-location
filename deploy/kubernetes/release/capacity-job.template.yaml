apiVersion: batch/v1
kind: Job
metadata:
  generateName: nearby-location-capacity-
  labels:
    app.kubernetes.io/name: nearby-location
    app.kubernetes.io/component: release-preflight
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nearby-location
        app.kubernetes.io/component: release-preflight
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: capacity-check
          image: __IMAGE_REF__
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/check-capacity.js"]
          envFrom:
            - configMapRef:
                name: nearby-location-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nearby-location-secrets
                  key: DATABASE_URL
            - name: CAPACITY_EXPECTED_REPLICAS
              value: "__EXPECTED_REPLICAS__"
            - name: CAPACITY_MAX_UTILIZATION_PERCENT
              value: "__CAPACITY_MAX_UTILIZATION_PERCENT__"
            - name: CAPACITY_EXTERNAL_RESERVE_CONNECTIONS
              value: "__CAPACITY_EXTERNAL_RESERVE_CONNECTIONS__"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
