# Run with `kubectl create -f migration-job.example.yaml` before rolling out a
# version that contains schema migrations. `command` overrides the image
# entrypoint, so this Job owns the migration attempt instead of every replica.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: nearby-location-migrate-
  labels:
    app.kubernetes.io/name: nearby-location
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nearby-location
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: nearby-location:2.14.1
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/run-migration.js", "up"]
          envFrom:
            - configMapRef:
                name: nearby-location-config
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nearby-location-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
